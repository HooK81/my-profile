monolog:
    handlers:
        main:
            type: fingers_crossed
            handler: nested
            action_level: info
            channels: ['main', 'http']

        default:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50
            channels: ['!event','!main', '!http']
        nested:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
            max_files: 5
            formatter: 'monolog.formatter.json'

        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
