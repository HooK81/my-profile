# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.locales: "en|fr"
    app.default_locale: "en"
    app.security.jwt_token_ttl: 28800 # 8 hours

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Message/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Controller\EmailController:
        calls:
            - setMailEnvVars: ["%env(MAILER_SUBJECT_PREFIX)%", "%env(MAILTER_TIMEZONE)%"]

    App\Manager\ProfileManager:
        $usersPath: "%kernel.project_dir%/%env(USERS_PATH)%"
        $defaultLocale: "%app.default_locale%"

    App\Security\TokenManager:
        $passPhrase: "%env(JWT_PASSPHRASE)%"
        $env: "%kernel.environment%"
        $tokenTtl: "%app.security.jwt_token_ttl%"

    App\Mailer\AppMailer:
        $defaultSenderMail: "%env(MAILER_SENDER)%"
        $teamMail: "%env(MAILER_TEAM_MAIL)%"

    App\Form\MailType:
        $mailSubject: "%env(MAILER_SUBJECT_DEFAULT)%"

    App\Security\PasswordHasher:
        $jwtUserUuid: "%env(APP_JWT_USER_UUID)%"

    App\EventListener\JWTListener:
        arguments:
            $env: "%kernel.environment%"
        tags:
          - {
              name: kernel.event_listener,
              event: lexik_jwt_authentication.on_jwt_created,
              method: onJWTCreated,
            }
          - {
              name: kernel.event_listener,
              event: lexik_jwt_authentication.on_jwt_decoded,
              method: onJWTDecoded,
            }
          - {
              name: kernel.event_listener,
              event: lexik_jwt_authentication.on_authentication_success,
              method: onAuthenticationSuccessResponse,
            }

    App\Normalizer\FormExceptionNormalizer:
        tags: ["serializer.normalizer", "serializer.exception_normalizer"]

    App\Normalizer\ExceptionNormalizerFactory:
        arguments: [!tagged serializer.exception_normalizer]
