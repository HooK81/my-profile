version: '3.7'
services: 

    app:
        build: 
            context: .
            dockerfile: docker/php/Dockerfile     
            args:
                APP_VERSION: ${TAG}   
        container_name: mp_app
        image: mp_app:${TAG}
        restart: "no"
        environment:
            HOME: /home/user
        
    web:
        build: 
            context: .
            dockerfile: docker/nginx/Dockerfile
            args:
                APP_VERSION: ${TAG}
        image: mp_web:${TAG}
        container_name: mp_web
        restart: "no"
        depends_on: 
            - app
        ports: 
            - '${NGINX_PORT}:80'