services:

    api:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
            args:
                API_PORT: ${API_PORT}
        image: mp_api:latest
        container_name: mp_api
        env_file:
            - docker/api/.secrets.production.local
        volumes:
            - './docker/users:/usr/src/app/apps/api/users:ro'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:${API_PORT}/health']
            interval: 30m
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - backend

    portfolio:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
            args:
                API_PORT: ${API_PORT}
        image: mp_portfolio:latest
        container_name: mp_portfolio
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8080']
            interval: 30m
            timeout: 5s
            retries: 3
            start_period: 10s
        ports:
            - '${NGINX_PORT}:8080'
        networks:
            - frontend
            - backend

networks:
    frontend:
    backend:
        internal: true
