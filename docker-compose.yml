version: '3.7'
services: 

    php:
        build: 
            context: .
            dockerfile: docker/php/Dockerfile     
            args:
                APP_VERSION: ${TAG}   
        container_name: mp_php
        image: myprofile_php:${TAG}
        restart: "no"
        environment:
            HOME: /home/user
        
    nginx:
        build: 
            context: .
            dockerfile: docker/nginx/Dockerfile
            args:
                APP_VERSION: ${TAG}
        image: myprofile_nginx:${TAG}
        container_name: mp_nginx
        restart: "no"
        depends_on: 
            - php
        ports: 
            - '${NGINX_PORT}:80'