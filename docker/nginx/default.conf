server {
    listen 8080;
    server_name ~.*;
    server_tokens off;

    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # GZip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json
            application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf
            application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml
            image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component
            text/x-cross-domain-policy;

    # Front - Any routes to index.html
    index index.html;
    location / {
        root /usr/src/front;
        try_files $uri $uri/ /index.html;

        # Cache
        location ~* \.(?:css|js)$ {
            expires 1M;
            add_header        Cache-Control "public";
            include /etc/nginx/conf.d/security-headers.conf;
        }

        location ~* \.(?:jpg|jpeg|gif|png|ico|xml|webp|eot|woff|woff2|ttf|svg|otf)$ {
            access_log        off;
            log_not_found     off;
            expires           1M;
            add_header        Cache-Control "public";
            include /etc/nginx/conf.d/security-headers.conf;
        }

        location ~* \.(?:json)$ {
            access_log        off;
            log_not_found     off;
            expires           1d;
            add_header        Cache-Control "public";
            include /etc/nginx/conf.d/security-headers.conf;
        }
    }

    # API
    location /api/ {
      rewrite /api/(.*) /$1 break;
      proxy_pass http://api:%API_PORT%;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      # Rate limits (per-IP + global)
      limit_req zone=api_general burst=20 nodelay;
      limit_req zone=api_general_global burst=100 nodelay;

      # Stricter rate limits per endpoint
      location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req zone=api_auth_global burst=20 nodelay;
        rewrite /api/(.*) /$1 break;
        proxy_pass http://api:%API_PORT%;
      }

      location /api/v1/mails {
        limit_req zone=api_mail nodelay;
        limit_req zone=api_mail_global burst=5 nodelay;
        rewrite /api/(.*) /$1 break;
        proxy_pass http://api:%API_PORT%;
      }
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
