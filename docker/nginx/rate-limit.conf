# Trust only the Docker frontend network gateway (upstream reverse proxy)
set_real_ip_from 172.20.0.1/32;
real_ip_header X-Real-IP;

# Per-IP rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_mail:10m rate=1r/m;

# Global rate limiting zones (shared across all IPs)
limit_req_zone $server_name zone=api_general_global:1m rate=50r/s;
limit_req_zone $server_name zone=api_auth_global:1m rate=10r/s;
limit_req_zone $server_name zone=api_mail_global:1m rate=5r/m;
