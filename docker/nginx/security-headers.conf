# Content-Security-Policy
# - 'unsafe-inline' for style-src: required by libraries that inject inline styles (e.g., tsparticles)
# - data: / blob: for img-src: profile image is loaded as a blob URL
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS — force HTTPS for 1 year, include subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Control referrer information sent to external sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features the site can use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
